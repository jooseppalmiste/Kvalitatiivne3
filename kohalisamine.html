<!DOCTYPE html>
<html>
<head>
  <title>Kaart</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.5.1/leaflet.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.5.1/leaflet.css" />

  <style>
    body {
      padding: 0;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    html, body {
      height: 100%;
      width: 100%;
    }

    #valikud {
      padding: 10px;
    }

    #vastus {
      padding: 10px;
      max-height: 180px;
      overflow-y: auto;
    }

    #kaardikiht {
      width: 100%;
      height: 70%;
    }
  </style>

  <script>
    var kaart;
    var hypik;
    var kohad = [];
    var markerid;

    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbzlFtosZNFZva7LLO_alJ8hBshxKHm0RjsW6o5Jo1Kyxhajg4xlueVfEHtMKHTqHaUdXg/exec";


    function algus(){

      kaart = L.map('kaardikiht').setView([59.439, 24.773], 12);

      new L.TileLayer(
        'https://tiles.maaamet.ee/tm/tms/1.0.0/hybriid@GMC/{z}/{x}/{y}.png&ASUTUS=TLU&ERIALA=DIGIHUMANITAARIA',
        {
          attribution: "Map: <a href='http://www.maaamet.ee/'>Maa-amet</a>",
          tms: true
        }
      ).addTo(kaart);

      hypik = L.popup();

      markerid = L.layerGroup();
      markerid.addTo(kaart);

      kaart.on("click", vajutus);

      // Loe Google Sheetis olevad andmed
      fetch(SCRIPT_URL)
        .then(d => d.json())
        .then(kuva);
    }


    function kuva(andmed){

      console.log(andmed);

      kohad = andmed;

      markerid.clearLayers();

      for(let i = 0; i < kohad.length; i++){

        let lat = parseFloat(kohad[i][0]);
        let lng = parseFloat(kohad[i][1]);

        if(!isNaN(lat) && !isNaN(lng)){

          let tyyp = kohad[i][2] || "koht";
          let kommentaar = kohad[i][3] || "";

          let tekst = tyyp;

          if(kommentaar != ""){
            tekst += ": " + kommentaar;
          }

          L.marker([lat, lng])
            .bindPopup(tekst)
            .addTo(markerid);
        }
      }
    }


    function vajutus(e){

      hypik
        .setLatLng(e.latlng)
        .setContent(
          "Valitud koht: " +
          e.latlng.lat.toFixed(5) +
          ", " +
          e.latlng.lng.toFixed(5)
        )
        .openOn(kaart);


      // ARVUTA KAUGUS IGAST TABELIS OLEVAST KOHAST

      let kaugused = [];

      for(let i = 0; i < kohad.length; i++){

        let lat = parseFloat(kohad[i][0]);
        let lng = parseFloat(kohad[i][1]);

        if(!isNaN(lat) && !isNaN(lng)){

          let tyyp = kohad[i][2] || "koht";
          let kommentaar = kohad[i][3] || "";

          let nimi = kommentaar != ""
            ? kommentaar + " (" + tyyp + ")"
            : tyyp;

          let tabeliKoht = L.latLng(lat, lng);

          let kaugus =
            e.latlng.distanceTo(tabeliKoht) / 1000;

          kaugused.push({
            nimi: nimi,
            kaugus: kaugus
          });
        }
      }


      // järjestame lähimast kaugemani

      kaugused.sort(function(a, b){
        return a.kaugus - b.kaugus;
      });


      let tekst =
        "<b>Valitud asukoht:</b> " +
        e.latlng.lat.toFixed(5) +
        ", " +
        e.latlng.lng.toFixed(5) +
        "<br><br>" +
        "<b>Kaugused tabelis olevatest kohtadest:</b><br>";


      for(let i = 0; i < kaugused.length; i++){

        tekst +=
          kaugused[i].nimi +
          " – " +
          kaugused[i].kaugus.toFixed(2) +
          " km<br>";
      }


      document.getElementById("vastus").innerHTML = tekst;


      // SALVESTA VALITUD KOHT GOOGLE SHEETSI

      let tyyp =
        document.getElementById("tyybivalik").value;

      let kommentaar =
        document.getElementById("kast1").value;

      let lisand =
        "laiuskraad=" + e.latlng.lat +
        "&pikkuskraad=" + e.latlng.lng +
        "&tyyp=" + encodeURIComponent(tyyp) +
        "&kommentaar=" + encodeURIComponent(kommentaar);


      fetch(SCRIPT_URL + "?" + lisand)
        .then(d => d.json())
        .then(kuva);
    }

  </script>
</head>


<body onload="algus()">

  <div id="valikud">

    Tüüp:

    <select id="tyybivalik">
      <option>kool</option>
      <option>kirik</option>
      <option>kauplus</option>
    </select>

    Kommentaar:

    <input type="text" id="kast1" />

    <span>
      Klõpsa kaardil asukoha valimiseks.
    </span>

  </div>


  <div id="vastus">
    Vali kaardilt asukoht.
  </div>


  <div id="kaardikiht"></div>

</body>
</html>
